[package]
name = "icon_gen_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = { version = "1.1.2+spec-1.1.0", features = ["serde"] }

# Feedback
log = { workspace = true }
thiserror = { version = "2.0.18" }

# Image Processing
image = { version = "0.25.10", features = ["png", "ico", "jpeg", "webp", "serde"] }
fast_image_resize = { version = "6.0.0", features = ["std", "image"] }

# SVG Processing
usvg = { version = "0.47.0", features = ["fontdb", "system-fonts", "text"] }
resvg = { version = "0.47.0", features = ["text", "system-fonts", "image-webp", "raster-images"] }
tiny-skia = { version = "0.12.0", features = ["png-format", "std"] }
fontdb = { version = "0.23.0", features = ["fs", "std"] }
css-color = { version = "0.2.8" }

# Parallelism
rayon = { version = "1.12.0" }